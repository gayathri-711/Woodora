<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263D32" />
      <stop offset="100%" stop-color="#3D5A4C" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805B42" />
      <stop offset="100%" stop-color="#A57A5D" />
    </linearGradient>
  </defs>
  <!-- Emblem: Minimalist leaf & wood grain arch -->
  <g transform="translate(6, 6)">
    <!-- Outer wood grain curve -->
    <path d="M 26 2 C 12 2, 2 13, 2 26 C 2 39, 12 50, 26 50 C 40 50, 50 39, 50 26" fill="none" stroke="url(#woodGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Inner botanical leaf curve -->
    <path d="M 26 8 C 36 14, 42 24, 38 36 C 34 44, 26 48, 26 48 C 26 48, 18 44, 14 36 C 10 24, 16 14, 26 8 Z" fill="url(#leafGrad)"/>
    <!-- Leaf central vein -->
    <path d="M 26 12 L 26 44" stroke="#F7F4EE" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Leaf subtle side veins -->
    <path d="M 26 22 L 32 18" stroke="#F7F4EE" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 26 28 L 20 24" stroke="#F7F4EE" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 26 34 L 32 30" stroke="#F7F4EE" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Small walnut root seed -->
    <circle cx="26" cy="49" r="2" fill="#805B42"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="68" y="37" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="#263D32">WOODORA</text>
  <!-- Tagline -->
  <text x="70" y="52" font-family="'Plus Jakarta Sans', 'Jost', 'Helvetica Neue', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="#805B42">CRAFTED FOR COMFORT</text>
</svg>

