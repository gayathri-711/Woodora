<!DOCTYPE html>
<html lang="en">
<head>
    <title>WOODORA – Administrative Operations Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="assets/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="assets/css/woodora.css" rel="stylesheet">
    <style>
        body { background: #1b2d24; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .admin-card { background: #263D32; border: 1px solid rgba(200,168,130,0.3); border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); max-width: 440px; width: 100%; padding: 40px; }
        .form-control { background: #1e3128; border: 1px solid #365345; color: #fff; border-radius: 6px; padding: 12px; }
        .form-control:focus { background: #1e3128; border-color: #C8A882; color: #fff; box-shadow: none; }
    </style>
</head>
<body>
<div class="admin-card">
    <div class="text-center mb-4">
        <img src="assets/images/footer-logo.svg" alt="WOODORA" style="max-height: 44px;" class="mb-3" onerror="this.src='assets/images/logo.png'">
        <h4 class="font-weight-bold" style="font-family:'Playfair Display',serif; color:#C8A882;">Back-Office Atelier Operations</h4>
        <p class="text-white-50 font-size-13">Enter verified administrator credentials to access inventory, orders, and inquiries.</p>
    </div>
    <div id="login-error" class="alert alert-danger font-size-13 py-2 d-none"></div>
    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
            <label class="font-size-13 font-weight-bold text-white-50">Administrator Email</label>
            <input type="email" id="admin-email" class="form-control" value="admin@woodora.com" required>
        </div>
        <div class="form-group">
            <label class="font-size-13 font-weight-bold text-white-50">Password</label>
            <input type="password" id="admin-password" class="form-control" value="admin123" required>
        </div>
        <button type="submit" class="btn btn-block py-2 font-weight-bold" style="background:#C8A882; color:#1b2d24;">Authenticate as Administrator</button>
        <div class="mt-3 text-center">
            <a href="index.html" class="text-white-50 font-size-13"><i class="fa-solid fa-arrow-left mr-1"></i> Return to Public Storefront</a>
        </div>
    </form>
</div>
<script>
function handleAdminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('admin-email').value;
    const password = document.getElementById('admin-password').value;
    const errBox = document.getElementById('login-error');

    fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    }).then(r => r.json()).then(res => {
        if (!res.success) {
            errBox.textContent = res.error || 'Authentication failed';
            errBox.classList.remove('d-none');
            return;
        }
        if (res.user.role !== 'Administrator') {
            errBox.textContent = 'Access restricted to Administrator role';
            errBox.classList.remove('d-none');
            return;
        }
        sessionStorage.setItem('woodora_admin_token', res.token);
        localStorage.setItem('woodora_active_user', JSON.stringify(res.user));
        window.location.href = 'admin-dashboard.html';
    }).catch(err => {
        // Fallback for direct testing
        if (email === 'admin@woodora.com' && password === 'admin123') {
            window.location.href = 'admin-dashboard.html';
        } else {
            errBox.textContent = 'Invalid administrator credentials';
            errBox.classList.remove('d-none');
        }
    });
}
</script>
</body>
</html>
