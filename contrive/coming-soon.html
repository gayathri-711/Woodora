<body style="background: linear-gradient(135deg, #263D32 0%, #1A2C23 100%);">
<div class="comingsoon_outer d-flex align-items-center" style="min-height: 100vh;">
    <section class="comingsoon_section position-relative w-100 py-5">
        <div class="container text-center text-white">
            <div class="row">
                <div class="col-lg-8 col-12 mx-auto">
                    <div class="logo_outer mb-4">
                        <a href="index.html">
                            <img src="assets/images/footer-logo.svg" alt="WOODORA" style="max-height: 54px;" onerror="this.onerror=null; this.src='assets/images/footer-logo.png'">
                        </a>
                    </div>
                    <div class="sub_banner_content">
                        <h6 style="color: #C8A882 !important; letter-spacing: 2px;">Studio Drop in Preparation</h6>

                        </p>
                        
                        <form class="newsletter-form mx-auto mb-4" style="max-width: 500px;" onsubmit="event.preventDefault(); window.Woodora.showToast('Privilege Reserved', 'Thank you. You will be notified when the studio doors open.'); this.reset();">

                                    <button class="btn px-4" type="submit" style="background: #805B42; color: #FFFFFF; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Notify Me</button>

                            </div>
                        </form>
